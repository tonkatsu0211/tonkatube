[build]
  command = "npm install && npm run build && npm i serverless-http @netlify/functions @types/express"
  publish = "/"

[functions]
  external_node_modules = ["express"]
  node_bundler = "esbuild"

[[redirects]]
  force = true
  from = "/*"
  status = 200
  to = "/.netlify/functions/api/:splat"
